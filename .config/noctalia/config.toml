[shell]
corner_radius_scale = 1.0
font_family = "Sans"
time_format = "{:%H:%M}"
date_format = "%A, %x"
offline_mode = false
telemetry_enabled = false
polkit_agent = false
password_style = "default"
settings_show_advanced = false
show_location = true
avatar_path = "~/.face"

clipboard_enabled = false
clipboard_history_max_entries = 50
clipboard_auto_paste = "off"
clipboard_image_action_command = ""
shared_gl_context = true

[shell.animation]
enabled = true
speed = 1.4

[shell.shadow]
direction = "down_right"
alpha = 0.55

[shell.panel]
transparency_mode = "soft"
borders = false
shadow = true
clipboard_placement = "attached"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"

[shell.mpris]
blacklist = []

[wallpaper]
enabled = true
fill_mode = "crop"
fill_color = "#000000"
transition = ["disc"]
transition_duration = 1500
edge_smoothness = 0.05
transition_on_startup = true
directory = "~/img"

[wallpaper.automation]
enabled = false
order = "random"
recursive = true

[backdrop]
enabled = false
blur_intensity = 0.4
tint_intensity = 0.6

[theme]
mode = "dark"
source = "community"
community_palette = "Vesper"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["sway", "foot", "qt", "gtk3", "gtk4", "btop", "kcolorscheme"]
enable_community_templates = true
community_ids = ["fuzzel"]

[notification]
enable_daemon = false
show_app_name = true
show_actions = true
layer = "top"
background_opacity = 1.0
offset_x = 20
offset_y = 8
blacklist = ["discord", "firefox", "chrome", "chromium", "edge"]

[osd]
position = "top_right"
orientation = "horizontal"
background_opacity = 1.0
offset_x = 20
offset_y = 8

[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
dnd = true
lock_keys = true
keyboard_layout = true

[lockscreen]
blurred_desktop = false
blur_intensity = 0.63
tint_intensity = 0.22

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0

[weather]
enabled = true
refresh_minutes = 30
unit = "celsius"
effects = true

[audio]
enable_overdrive = false
enable_sounds = false
sound_volume = 0.5
volume_change_sound = ""
notification_sound = ""

[brightness]
enable_ddcutil = false

[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 4400

[location]
auto_locate = false
address = "london"
sunset = "18:30"
sunrise = "06:30"

[idle]
pre_action_fade_seconds = 5.0

[idle.behavior.lock]
timeout = 300
command = "noctalia:session lock"
enabled = true

[idle.behavior.screen-off]
timeout = 600
command = "noctalia:dpms-off"
resume_command = "noctalia:dpms-on"
enabled = true

[idle.behavior.suspend]
timeout = 60
command = "noctalia:session suspend"
enabled = true

[keybinds]
validate = ["return", "kp_enter"]
cancel = ["escape"]
left = ["ctrl+h"]
right = ["ctrl+l"]
up = ["ctrl+k"]
down = ["ctrl+j"]

[bar.main]
position = "top"
thickness = 34
background_opacity = 0.93
radius = 12
padding = 2
widget_spacing = 6
scale = 1.0
shadow = true
auto_hide = false
reserve_space = true
capsule = true

start = ["launcher", "workspaces", "media"]
center = ["clock"]
end = ["tray", "sysmon", "battery", "volume", "brightness", "control-center"]

[dock]
enabled = false
position = "bottom"
icon_size = 48
background_opacity = 1.0
auto_hide = true
reserve_space = false
show_running = true
launcher_position = "end"
pinned = []

[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "wallpaper"
[[control_center.shortcuts]]
type = "notification"
[[control_center.shortcuts]]
type = "nightlight"
[[control_center.shortcuts]]
type = "session"

[desktop_widgets]
enabled = false

[theme.templates.user.fzf]
input_path = "~/.config/noctalia/templates/fzf.sh"
output_path = "~/.config/fzf/noctalia-theme.sh"
post_hook = ""

[theme.templates.user.mako]
input_path = "~/.config/noctalia/templates/mako.conf"
output_path = "~/.config/mako/config"
post_hook = "makoctl reload"
